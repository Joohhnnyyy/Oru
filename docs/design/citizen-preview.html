<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oru — Enter your little world</title>
<style>
@font-face{font-family:Baloo;src:url('../../frontend/node_modules/@fontsource-variable/baloo-2/files/baloo-2-latin-wght-normal.woff2');font-weight:400 800;font-display:swap}
*{box-sizing:border-box}body{margin:0;background:#1d2330;color:white;font:15px/1.6 system-ui,sans-serif}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #3ec5f5;outline-offset:5px}a{color:inherit}button{border:0}h1,h2,p{margin:0}h1:focus{outline:0}h1,h2{font-family:Baloo,system-ui;font-weight:800;line-height:1.02;letter-spacing:-.03em}h1{font-size:clamp(44px,5.8vw,82px)}h2{font-size:32px}.backdrop{position:fixed;inset:-5%;width:110%;height:110%;object-fit:cover;opacity:.42;pointer-events:none;animation:arrive 1.8s cubic-bezier(.22,1,.36,1) both}.shade{position:fixed;inset:0;background:linear-gradient(#1d233080,transparent 50%,#1d2330);pointer-events:none}header{position:relative;z-index:2;display:flex;align-items:center;gap:16px;padding:24px 5vw}header img{width:72px}header .position{margin-right:auto;font-size:10px;letter-spacing:.12em}.quiet{background:#ffffff15;border:1px solid #ffffff30;border-radius:999px;color:white;padding:10px 18px;min-height:44px}.motion{font-size:11px}.experience{position:relative;z-index:1;max-width:1200px;margin:auto;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:70px;padding:35px 50px 70px;min-height:calc(100dvh - 150px)}.world{text-align:center;animation:enter .6s ease both}.world p{max-width:440px;margin:20px auto 0;color:#ffffffd9}.guardian-stage{position:relative;display:grid;place-items:center;min-height:340px}.halo{position:absolute;width:280px;height:90px;border-radius:50%;background:#6eddb060;filter:blur(30px);bottom:40px}.guardian{width:min(100%,350px);height:320px;object-fit:contain;filter:drop-shadow(0 30px 25px #0003);animation:float 5s ease-in-out infinite}.reveal .guardian{animation:wake 1s cubic-bezier(.22,1,.36,1) both,float 5s 1s ease-in-out infinite}.guardian.wave{animation:wave .65s ease both}.guardian-button{background:none;border:0;padding:0;width:100%;color:white;border-radius:40px}.panel{background:#fffaf4;color:#1d2330;border-radius:36px;padding:40px;box-shadow:0 24px 80px #0002;animation:enter .65s .1s ease both}.panel p{color:#596274;margin-top:16px}.eyebrow{display:block;font-size:10px;letter-spacing:.13em;margin-bottom:20px;color:#08769f}.choices{display:flex;gap:12px;margin:28px 0 20px}.choice{flex:1;position:relative}.choice input{position:absolute;opacity:0}.choice span{display:block;padding:18px;text-align:center;border:1px solid #d9dde3;border-radius:18px;cursor:pointer}.choice input:checked+span{background:#d4fae8;border-color:#48aa80}.choice input:focus-visible+span{outline:3px solid #08769f;outline-offset:4px}.primary{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:56px;border-radius:999px;padding:14px 24px;background:#1d2330;color:white;font-weight:700;margin-top:24px;transition:transform .25s ease}.primary:hover{transform:translateY(-3px)}.primary:active{transform:scale(.98)}.helper{font-size:12px}.progress{display:flex;justify-content:space-between;font-size:11px;color:#596274;border-top:1px solid #e4e5df;padding-top:18px;margin-top:24px}.dock{display:flex;justify-content:center;gap:10px;grid-column:1/-1}.dock a{padding:10px 20px;border-radius:999px;background:#ffffff12;text-decoration:none;font-size:12px}.dock a:hover{background:#ffffff28}.preview-label{position:relative;text-align:center;font-size:10px;color:#ffffff90;padding:0 20px 20px}dialog{border:0;border-radius:28px;padding:32px;color:#1d2330;background:#fffaf4;width:min(440px,calc(100% - 40px))}dialog::backdrop{background:#1d2330aa;backdrop-filter:blur(8px)}dialog p{margin-top:16px}dialog .quiet{color:#1d2330;background:#e8e9e4;width:100%;margin-top:12px}.no-motion *, .no-motion *::before,.no-motion *::after{animation:none!important;transition:none!important}.no-motion .backdrop{transform:none}
@keyframes arrive{from{transform:scale(1.05) translateY(20px)}to{transform:scale(1) translateY(0)}}@keyframes enter{from{opacity:0}to{opacity:1}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}@keyframes wake{from{opacity:0;transform:scale(.65) translateY(30px)}70%{opacity:1;transform:scale(1.04) translateY(-8px)}to{transform:scale(1)}}@keyframes wave{25%{transform:rotate(-8deg)}70%{transform:rotate(6deg)}to{transform:rotate(0)}}
@media(max-width:700px){header{padding:20px;gap:10px}header img{width:52px}.position{max-width:90px}.quiet{padding:10px 12px}.motion{padding:8px}.experience{grid-template-columns:1fr;gap:10px;padding:20px 24px 35px;min-height:0}.world p{font-size:14px}.guardian-stage{min-height:230px}.guardian{height:230px;width:270px}.halo{bottom:20px;width:220px}.panel{padding:26px;border-radius:28px}h2{font-size:28px}.choices{margin-top:22px}.dock{gap:8px;flex-wrap:wrap;margin-top:18px}.dock a{padding:9px 16px}.progress{font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<body><img class="backdrop" src="../../frontend/public/media/scenes/plaza.webp" alt=""><div class="shade"></div>
<header><a href="immersive-preview.html" aria-label="Oru website"><img src="../../frontend/public/media/brand/wordmark-large.webp" alt="Oru"></a><span class="position"></span><button class="quiet motion" aria-pressed="false">Reduce motion</button><button class="quiet back">Back</button></header>
<main class="experience" id="experience"></main><p class="preview-label">Interactive design preview · Sample neighbourhood and progress · No account data is sent</p>
<dialog aria-labelledby="confirmation-title"><h2 id="confirmation-title">A little good, really done?</h2><p>Only record an action after you have actually done it. This preview demonstrates the flow; it does not submit evidence or award credits.</p><button class="primary confirm">I’ve sorted my waste <span aria-hidden="true">✓</span></button><button class="quiet cancel">Not yet</button></dialog>
<script>
const routes=['language','location','reveal','home'],main=document.querySelector('main'),dialog=document.querySelector('dialog');let language='en',done=false;
const copy={language:['A little world.<br>In your own words.','Choose the language that feels like home.'],location:['Every world<br>starts somewhere.','A place to belong. A guardian to grow with.'],reveal:['Someone is<br>waiting for you.','Meet your river dolphin, a guardian of Yamuna Bank.'],home:['A little good,<br>every day.','Your dolphin is waking up. Bring one small act to life.']};
function go(route){location.hash=route}function current(){return routes.includes(location.hash.slice(1))?location.hash.slice(1):'language'}
function render(){const route=current(),index=routes.indexOf(route);document.documentElement.lang="en";document.querySelector('.position').textContent=index===3?'YOUR LITTLE WORLD':`${String(index+1).padStart(2,'0')} / ENTER ORU`;document.querySelector('.back').textContent=index===0?'Website':'Back';
const panels={language:`<span class="eyebrow">YOUR WORLD. YOUR WORDS.</span><h2>Make yourself at home.</h2><div class="choices"><label class="choice"><input type="radio" name="language" value="en" ${language==='en'?'checked':''}><span>English</span></label><label class="choice"><input type="radio" name="language" value="hi" ${language==='hi'?'checked':''}><span lang="hi">हिन्दी</span></label></div><button class="primary next">Continue <span aria-hidden="true">↗</span></button><p class="helper">Your selection is remembered during this preview. Full translated screens are planned for the app.</p>`,location:`<span class="eyebrow">FIND YOUR CORNER</span><h2>Good starts close to home.</h2><p>In Oru, your neighbourhood connects you to a guardian. Location is requested with an explanation when you set up your real account.</p><button class="primary next">Explore a sample neighbourhood <span aria-hidden="true">↗</span></button><p class="helper">Preview: Yamuna Bank. No location permission is requested.</p>`,reveal:`<span class="eyebrow">YOUR GUARDIAN</span><h2>Your river dolphin.</h2><p>Yamuna Bank · Recovering<br>Small, real actions help your shared territory grow.</p><button class="primary next">Step into my world <span aria-hidden="true">↗</span></button><p class="helper">A small beginning. A world that grows with you.</p>`,home:`<span class="eyebrow">ONE SMALL THING FOR TODAY</span><h2>${done?'A small act. A greener day.':'Sort today. Grow tomorrow.'}</h2><p>${done?'Your preview action is recorded. In the app, evidence and verification determine rewards.':'Keep wet and dry waste separate. Record it after you have really done it.'}</p><button class="primary daily">${done?'Review your preview action':'I’ve done today’s action'} <span aria-hidden="true">↗</span></button><div class="progress"><span>Sample streak · 7 days</span><span>Sample GC · 240</span><span>Sample health · 42 / 100</span></div>`};
main.className='experience '+route;main.innerHTML=`<div class="world"><h1 tabindex="-1">${copy[route][0]}</h1><p>${copy[route][1]}</p><div class="guardian-stage"><div class="halo"></div><button class="guardian-button" aria-label="Say hello to your guardian"><img class="guardian" src="../../frontend/public/media/characters/${index>=2?'dolphin':'buddy'}.webp" alt="${index>=2?'River dolphin guardian':'Oru flower guardian'}"></button></div></div><section class="panel" aria-label="${route} choices">${panels[route]}</section>${index===3?'<nav class="dock" aria-label="Preview navigation"><a href="#home" aria-current="page">My world</a><a href="immersive-preview.html#guardians">Guardians</a><a href="#language">Replay welcome</a></nav>':''}`;
main.querySelector('.next')?.addEventListener('click',()=>go(routes[index+1]));main.querySelectorAll('input[name=language]').forEach(n=>n.addEventListener('change',()=>{language=n.value;document.documentElement.lang="en"}));main.querySelector('.daily')?.addEventListener('click',()=>dialog.showModal());main.querySelector('.guardian-button').addEventListener('click',()=>{const n=main.querySelector('.guardian');n.classList.remove('wave');void n.offsetWidth;n.classList.add('wave');n.addEventListener('animationend',()=>n.classList.remove('wave'),{once:true})});main.querySelector('h1').focus({preventScroll:true});window.scrollTo(0,0)}
document.querySelector('.back').addEventListener('click',()=>{const i=routes.indexOf(current());if(i===0)location.href='immersive-preview.html';else go(routes[i-1])});document.querySelector('.cancel').onclick=()=>dialog.close();document.querySelector('.confirm').onclick=()=>{done=true;dialog.close();render();main.querySelector('.daily').focus()};
const motion=document.querySelector('.motion'),reduced=matchMedia('(prefers-reduced-motion:reduce)');function setMotion(off){document.documentElement.classList.toggle('no-motion',off);motion.setAttribute('aria-pressed',String(off));motion.textContent=off?'Motion off':'Reduce motion'}setMotion(reduced.matches);motion.onclick=()=>setMotion(motion.getAttribute('aria-pressed')!=='true');reduced.addEventListener('change',e=>setMotion(e.matches));window.addEventListener('hashchange',render);render();
</script></body></html>
