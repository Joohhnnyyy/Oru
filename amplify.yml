version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm
        - pnpm install
        - if [ -f cdk-outputs.json ]; then pnpm export-env --frontend-only; fi
        - pnpm --filter @saafsafari/shared build
        - pnpm --filter @saafsafari/game-rules build
    build:
      commands:
        - pnpm --filter web build
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .pnpm-store/**/*
