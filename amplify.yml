version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm
        - pnpm install
        - pnpm --filter @saafsafari/shared build
        - pnpm --filter @saafsafari/game-rules build
    build:
      commands:
        - pnpm --filter oru build
  artifacts:
    baseDirectory: apps/web/dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .pnpm-store/**/*
