<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Oru is offline</title>
    <meta name="theme-color" content="#f5faf2" />
    <style>
      :root { --bg:#f5faf2; --ink:#12332a; --muted:#4b6358; --card:#fff; }
      @media (prefers-color-scheme: dark) { :root { --bg:#0f1f19; --ink:#e8f3ec; --muted:#a9c2b5; --card:#172b23; } }
      body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
        font: 16px/1.65 'Noto Sans','Noto Sans Devanagari',system-ui,sans-serif; }
      main { max-width: 30rem; margin: 16px; padding: 24px; background: var(--card); border: 2px solid #12332a; border-radius: 20px; }
      h1 { font-size: 1.5rem; line-height: 1.3; margin: 0 0 8px; }
      p { margin: 0 0 12px; color: var(--muted); }
      a { display:inline-flex; align-items:center; min-height:48px; padding:0 20px; border:2.5px solid #12332a; border-radius:999px;
        background:#4ade80; color:#12332a; font-weight:700; text-decoration:none; box-shadow:0 3px 0 #12332a; }
      a:focus-visible { outline: 3px solid #14532d; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Oru could not reach the internet. Anything you already opened still works. Try again when you have signal.</p>
      <div lang="hi">
        <h2 style="font-size:1.5rem;line-height:1.3;margin:20px 0 8px">आप ऑफ़लाइन हैं</h2>
        <p>Oru इंटरनेट से नहीं जुड़ पाया। जो आपने पहले खोला था वह अब भी चलेगा। नेटवर्क मिलने पर फिर कोशिश करें।</p>
      </div>
      <a href="/">Try again / फिर कोशिश करें</a>
    </main>
  </body>
</html>
